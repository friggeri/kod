name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run static checks
        run: Scripts/check static

  core:
    name: KodCore tests
    needs: static
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify pinned toolchain
        run: test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.5"
      - name: Run KodCore tests
        run: Scripts/check core

  language:
    name: Language integration tests
    needs: static
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify pinned toolchain
        run: test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.5"
      - name: Install rust-analyzer
        run: rustup component add rust-analyzer
      - name: Provision pinned integration dependencies
        run: Scripts/vendor-test-language-servers/setup.sh
      - name: Run language integration tests
        run: Scripts/check language

  ui-package:
    name: KodUI tests
    needs: static
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify pinned toolchain
        run: test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.5"
      - name: Run KodUI tests
        run: Scripts/check ui

  app:
    name: App logic tests
    needs: static
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify pinned toolchain
        run: test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.5"
      - name: Run app logic tests
        run: Scripts/check app

  release-build:
    name: Release build
    needs:
      - core
      - language
      - ui-package
      - app
      - ui
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify pinned toolchain
        run: test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.5"
      - name: Build reusable unsigned Release archive
        run: Scripts/check release-build
      - name: Attest tested archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: Artifacts/ci-release/Kod.xcarchive.zip
      - name: Retain tested archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kod-release-archive-${{ github.sha }}
          path: Artifacts/ci-release/Kod.xcarchive.zip
          if-no-files-found: error
          retention-days: 14

  ui:
    name: UI tests (${{ matrix.shard }}/2)
    needs: static
    runs-on: macos-26
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify pinned toolchain
        run: test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.5"
      - name: Run UI test shard
        run: Scripts/check "ui-${{ matrix.shard }}"
