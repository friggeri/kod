name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

jobs:
  static:
    name: Static checks
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run static checks
        run: Scripts/check static

  core:
    name: KodCore tests
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify pinned toolchain
        run: test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.5"
      - name: Run KodCore tests
        run: Scripts/check core

  language:
    name: Language integration tests
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify pinned toolchain
        run: test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.5"
      - name: Install rust-analyzer
        run: rustup component add rust-analyzer
      - name: Provision pinned integration dependencies
        run: Scripts/vendor-test-language-servers/setup.sh
      - name: Run language integration tests
        run: Scripts/check language

  large-file:
    name: Large-file benchmarks
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify pinned toolchain
        run: test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.5"
      - name: Run isolated 10 MB benchmarks
        run: Scripts/check large-file

  ui-package:
    name: KodUI tests
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify pinned toolchain
        run: test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.5"
      - name: Run KodUI tests
        run: Scripts/check ui

  app:
    name: App logic tests
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify pinned toolchain
        run: test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.5"
      - name: Run app logic tests
        run: Scripts/check app

  release-build:
    name: Release build
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify pinned toolchain
        run: test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.5"
      - name: Build Release configuration
        run: Scripts/check release-build

  ui:
    name: UI tests (${{ matrix.shard }}/2)
    runs-on: macos-26
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify pinned toolchain
        run: test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.5"
      - name: Run UI test shard
        run: Scripts/check "ui-${{ matrix.shard }}"
