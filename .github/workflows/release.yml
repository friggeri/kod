name: Build release draft

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        default: 0.1.0
        type: string

permissions: {}

concurrency:
  group: kod-production-release
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
  SPARKLE_VERSION: 2.9.6
  SPARKLE_ARCHIVE_SHA256: 52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192
  CYCLONEDX_CLI_VERSION: 0.33.1
  CYCLONEDX_CLI_OSX_ARM64_SHA256: 750c148780154833f6401f9067d08c5a4c31567b6ee3c26c062c3a95c62d741c

jobs:
  release:
    runs-on: macos-26
    environment: release
    timeout-minutes: 240
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: metadata
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            case "$GITHUB_REF_NAME" in
              v*) version=${GITHUB_REF_NAME#v} ;;
              *) echo "Tag must start with v: $GITHUB_REF_NAME" >&2; exit 64 ;;
            esac
          else
            version=$DISPATCH_VERSION
          fi
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check out and validate the exact annotated tag
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "friggeri/kod"
          printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.5"
          test "$GITHUB_REF" = "refs/tags/v$VERSION"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          git fetch --no-tags --force origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
          test "$(git cat-file -t "refs/tags/v$VERSION")" = "tag"
          git checkout -f "v$VERSION"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git describe --exact-match --tags HEAD)" = "v$VERSION"
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          test -z "$(git status --porcelain)"

      - name: Download and verify tested CI archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ci_runs=$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --commit "$GITHUB_SHA" \
              --event push \
              --status success \
              --limit 20 \
              --json databaseId,headSha,conclusion
          )
          ci_run_id=$(
            printf '%s' "$ci_runs" | jq -r --arg sha "$GITHUB_SHA" \
              '[.[] | select(.headSha == $sha and .conclusion == "success")][0].databaseId // empty'
          )
          if [ -z "$ci_run_id" ]; then
            echo "BLOCKED: no successful CI push run exists for $GITHUB_SHA." >&2
            exit 65
          fi

          artifact_name="kod-release-archive-$GITHUB_SHA"
          download_dir="$RUNNER_TEMP/tested-ci-archive"
          extract_dir="$RUNNER_TEMP/tested-ci-archive-extracted"
          rm -rf -- "$download_dir" "$extract_dir"
          mkdir -p "$download_dir" "$extract_dir"
          gh run download "$ci_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" \
            --dir "$download_dir"
          archive_zip="$download_dir/Kod.xcarchive.zip"
          test -s "$archive_zip"

          gh attestation verify "$archive_zip" \
            --repo friggeri/kod \
            --signer-workflow "friggeri/kod/.github/workflows/ci.yml" \
            --source-ref "refs/heads/main" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners

          /usr/bin/ditto -x -k "$archive_zip" "$extract_dir"
          archive_path="$extract_dir/Kod.xcarchive"
          test -d "$archive_path/Products/Applications/Kod.app"
          echo "KOD_PREBUILT_ARCHIVE_PATH=$archive_path" >> "$GITHUB_ENV"
          echo "Promoting tested CI run $ci_run_id for commit $GITHUB_SHA" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Download pinned Sparkle release tools
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Sparkle-$SPARKLE_VERSION.tar.xz"
          tools="$RUNNER_TEMP/Sparkle-$SPARKLE_VERSION"
          curl --fail --location --retry 3 \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz" \
            --output "$archive"
          echo "$SPARKLE_ARCHIVE_SHA256  $archive" | shasum -a 256 -c -
          mkdir "$tools"
          tar -xJf "$archive" -C "$tools"
          test -x "$tools/bin/generate_appcast"
          test -x "$tools/bin/sign_update"
          {
            echo "KOD_SPARKLE_GENERATE_APPCAST=$tools/bin/generate_appcast"
            echo "KOD_SPARKLE_SIGN_UPDATE=$tools/bin/sign_update"
          } >> "$GITHUB_ENV"

      - name: Download pinned CycloneDX schema validator
        run: |
          set -euo pipefail
          validator="$RUNNER_TEMP/cyclonedx-$CYCLONEDX_CLI_VERSION-osx-arm64"
          curl --fail --location --retry 3 \
            "https://github.com/CycloneDX/cyclonedx-cli/releases/download/v$CYCLONEDX_CLI_VERSION/cyclonedx-osx-arm64" \
            --output "$validator"
          echo "$CYCLONEDX_CLI_OSX_ARM64_SHA256  $validator" | shasum -a 256 -c -
          chmod 700 "$validator"
          "$validator" --version | grep -Eq "^$CYCLONEDX_CLI_VERSION\\+"
          echo "KOD_CYCLONEDX_CLI=$validator" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          : "${CERTIFICATE_P12_BASE64:?DEVELOPER_ID_P12_BASE64 is empty}"
          : "${CERTIFICATE_PASSWORD:?DEVELOPER_ID_P12_PASSWORD is empty}"
          keychain_path="$RUNNER_TEMP/kod-signing.keychain-db"
          keychain_password="$(uuidgen)"
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          cleanup_import() {
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            rm -f -- "$certificate_path"
          }
          trap cleanup_import EXIT HUP INT TERM
          rm -f -- "$keychain_path" "$certificate_path"
          printf '%s' "$CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          test -s "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          existing_keychains=$(security list-keychains -d user | tr -d '"')
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain_path" $existing_keychains
          {
            echo "KOD_RELEASE_KEYCHAIN=$keychain_path"
            echo "KOD_RELEASE_CERTIFICATE=$certificate_path"
          } >> "$GITHUB_ENV"
          trap - EXIT HUP INT TERM

      - name: Write notarization API key
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          : "${PRIVATE_KEY:?APP_STORE_CONNECT_PRIVATE_KEY is empty}"
          key_path="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f -- "$key_path"' EXIT HUP INT TERM
          rm -f -- "$key_path"
          printf '%s' "$PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          test -s "$key_path"
          echo "KOD_NOTARIZATION_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          trap - EXIT HUP INT TERM

      - name: Build signed and notarized binaries
        env:
          KOD_CODE_SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          KOD_DEVELOPMENT_TEAM: ${{ vars.APPLE_TEAM_ID }}
          KOD_NOTARIZATION_API_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          KOD_NOTARIZATION_API_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          : "${KOD_CODE_SIGN_IDENTITY:?DEVELOPER_ID_APPLICATION_IDENTITY is empty}"
          : "${KOD_DEVELOPMENT_TEAM:?APPLE_TEAM_ID is empty}"
          : "${KOD_NOTARIZATION_API_KEY_ID:?APP_STORE_CONNECT_KEY_ID is empty}"
          : "${KOD_NOTARIZATION_API_ISSUER_ID:?APP_STORE_CONNECT_ISSUER_ID is empty}"
          : "${SPARKLE_PUBLIC_ED_KEY:?SPARKLE_PUBLIC_ED_KEY is empty}"
          Scripts/release/package-release.sh "${{ steps.metadata.outputs.version }}"

      - name: Remove Developer ID and notarization credentials
        if: always()
        run: |
          security delete-keychain "${KOD_RELEASE_KEYCHAIN:-$RUNNER_TEMP/missing-keychain}" || true
          rm -f -- \
            "${KOD_RELEASE_CERTIFICATE:-$RUNNER_TEMP/missing-certificate}" \
            "${KOD_NOTARIZATION_API_KEY_PATH:-$RUNNER_TEMP/missing-notary-key}"

      - name: Generate and verify signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${SPARKLE_PRIVATE_KEY:?SPARKLE_PRIVATE_KEY is empty}"
          Scripts/release/sign-appcast.sh "${{ steps.metadata.outputs.version }}"

      - name: Finalize and validate release metadata
        run: Scripts/release/finalize-release.sh "${{ steps.metadata.outputs.version }}"

      - name: Attest every release archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            Artifacts/release/Kod-${{ steps.metadata.outputs.version }}-arm64.dmg
            Artifacts/release/Kod-${{ steps.metadata.outputs.version }}-arm64.zip
            Artifacts/release/Kod-${{ steps.metadata.outputs.version }}-licenses.zip

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            Artifacts/release/*.dmg \
            Artifacts/release/*.zip \
            Artifacts/release/appcast.xml \
            Artifacts/release/SHA256SUMS.txt \
            Artifacts/release/sbom.cdx.json \
            Artifacts/release/install-lifecycle-report.json \
            Artifacts/release/*.provenance.json \
            --draft \
            --verify-tag \
            --title "Kod v$VERSION" \
            --generate-notes

      - name: Remove ephemeral credentials
        if: always()
        run: |
          security delete-keychain "${KOD_RELEASE_KEYCHAIN:-$RUNNER_TEMP/missing-keychain}" || true
          rm -f -- \
            "${KOD_RELEASE_CERTIFICATE:-$RUNNER_TEMP/missing-certificate}" \
            "${KOD_NOTARIZATION_API_KEY_PATH:-$RUNNER_TEMP/missing-notary-key}"
