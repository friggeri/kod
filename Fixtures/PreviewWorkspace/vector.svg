<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <title>Kod SVG preview fixture</title>
  <desc>Gradient background with geometric shapes and centered text</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0.75"/>
    </radialGradient>
  </defs>
  <rect width="640" height="400" rx="32" fill="url(#background)"/>
  <circle cx="112" cy="104" r="58" fill="url(#orb)" opacity="0.9"/>
  <path d="M520 62 L590 182 L450 182 Z" fill="#f472b6" opacity="0.8"/>
  <rect x="58" y="244" width="524" height="98" rx="22" fill="#020617" opacity="0.5"/>
  <text x="320" y="296" fill="#ffffff" font-family="Helvetica, Arial, sans-serif"
